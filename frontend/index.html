<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Panel operativo de monitoreo bovino para My Ganado.">
  <title>My Ganado | Monitoreo</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="auth-mount"></div>
  <div class="app-shell" hidden>
    <aside class="sidebar">
      <a class="brand" href="#inicio" aria-label="My Ganado, inicio">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <span>my ganado</span>
      </a>
      <button id="menu-toggle" class="menu-toggle" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="primary-navigation"><span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span></button>
      <nav id="primary-navigation" aria-label="Navegación principal">
        <a class="nav-link active" href="#inicio">Resumen</a>
        <a class="nav-link" href="#animales">Animales</a>
        <a class="nav-link" href="#historial">Historial</a>
        <div class="alerts-nav">
          <button class="nav-link nav-button" id="alert-toggle" type="button" aria-expanded="false" aria-controls="alert-popover">Alertas <span id="nav-alert-count" class="nav-count">0</span><span class="chevron" aria-hidden="true"></span></button>
          <div class="alert-popover" id="alert-popover" hidden>
            <div class="popover-heading"><strong>Alertas recientes</strong><span id="popover-alert-count">0 registradas</span></div>
            <div id="alert-popover-list" class="popover-list"><p>No hay alertas registradas.</p></div>
            <a class="popover-all" href="#alertas">Ver todas las alertas</a>
          </div>
        </div>
        <a class="nav-link" href="#veterinario">Veterinario</a>
      </nav>
      <div class="account-menu"><strong id="account-name"></strong><span id="account-role"></span><button id="logout-button" class="text-button" type="button">Cerrar sesión</button></div>
    </aside>

    <main class="main-content">
      <div id="views-mount"></div>
      <footer class="page-footer"><span>My Ganado: apoyo para seguimiento de salud bovina</span><span>Clasificación de riesgo por medición</span><span>Seguimiento de apoyo, no diagnóstico veterinario</span></footer>
    </main>
  </div>
  <div id="dialog-mount"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="src/boot.js"></script>
</body>
</html>
